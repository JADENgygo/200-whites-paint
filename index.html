<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2ec" />
    <meta name="description" content="200色の白だけで描くペイントアプリ" />
    <link rel="canonical" href="https://200-whites-paint.pages.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="200 WHITES" />
    <meta property="og:title" content="200 WHITES — 白だけのペイント" />
    <meta
      property="og:description"
      content="200色の白だけで描くペイントアプリ"
    />
    <meta property="og:url" content="https://200-whites-paint.pages.dev/" />
    <meta
      property="og:image"
      content="https://200-whites-paint.pages.dev/ogp.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="200 WHITESの白色パレット" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="200 WHITES — 白だけのペイント" />
    <meta
      name="twitter:description"
      content="200色の白だけで描くペイントアプリ"
    />
    <meta
      name="twitter:image"
      content="https://200-whites-paint.pages.dev/ogp.png"
    />
    <meta name="twitter:image:alt" content="200 WHITESの白色パレット" />
    <title>200 WHITES — 白だけのペイント</title>
  </head>
  <body>
    <div id="app">
      <header class="hero">
        <h1><span>200</span> WHITES</h1>
        <a
          class="x-link"
          href="https://x.com/JADENgygo"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Xで@JADENgygoを開く"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M18.9 2H22l-6.77 7.74L23.2 22h-6.24l-4.89-6.39L6.48 22H3.36l7.26-8.3L2.98 2h6.4l4.42 5.84L18.9 2Zm-1.09 17.84h1.72L8.44 4.05H6.6l11.21 15.79Z"
            />
          </svg>
        </a>
      </header>
      <main>
        <section class="palette-section" aria-labelledby="palette-heading">
          <div class="section-heading">
            <div>
              <span class="step">01</span>
              <h2 id="palette-heading">白を選ぶ</h2>
            </div>
            <div class="palette-controls">
              <button
                id="theme-toggle"
                class="text-toggle"
                type="button"
                aria-pressed="false"
              >
                ダークモード
              </button>
              <button
                id="palette-toggle"
                class="palette-toggle"
                type="button"
                aria-expanded="true"
                aria-controls="palette"
              >
                パレットを最小化
              </button>
              <div
                class="target-switch"
                role="radiogroup"
                aria-label="色の適用先"
              >
                <!-- biome-ignore lint/a11y/useSemanticElements: 選択状態をボタンの外観と操作のままラジオとして通知するため -->
                <button
                  id="brush-mode"
                  class="target-button is-active"
                  type="button"
                  role="radio"
                  aria-checked="true"
                >
                  筆色
                </button>
                <!-- biome-ignore lint/a11y/useSemanticElements: 選択状態をボタンの外観と操作のままラジオとして通知するため -->
                <button
                  id="background-mode"
                  class="target-button"
                  type="button"
                  role="radio"
                  aria-checked="false"
                >
                  背景色
                </button>
              </div>
              <p>
                <span id="selected-swatch" class="selected-swatch"></span
                ><span id="selected-name"></span>
              </p>
            </div>
          </div>
          <div
            id="palette"
            class="palette"
            role="radiogroup"
            aria-label="200色の白"
          ></div>
        </section>

        <section class="canvas-section" aria-labelledby="canvas-heading">
          <div class="section-heading canvas-heading">
            <div>
              <span class="step">02</span>
              <h2 id="canvas-heading">白で描く</h2>
            </div>
            <label class="brush-control">
              <span>筆の太さ</span>
              <input
                id="brush-size"
                type="range"
                min="4"
                max="80"
                value="24"
              />
              <output id="brush-output">24</output>
            </label>
          </div>
          <div class="canvas-frame">
            <canvas
              id="paint-canvas"
              width="1600"
              height="900"
              aria-label="描画キャンバス"
            ></canvas>
          </div>
          <div class="actions">
            <div class="history-actions">
              <button
                id="clear-button"
                class="button button-quiet"
                type="button"
              >
                キャンバスを消す
              </button>
              <button
                id="undo-clear-button"
                class="button button-quiet"
                type="button"
                disabled
              >
                消去を元に戻す
              </button>
            </div>
            <div class="primary-actions">
              <button id="copy-button" class="button" type="button">
                クリップボードにコピー
              </button>
              <button
                id="save-button"
                class="button button-dark"
                type="button"
              >
                PNGで保存
              </button>
            </div>
          </div>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
